<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dirge z128 play</title>
<style>
  html, body { margin: 0; height: 100%; background: #181a20; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: fixed; left: 8px; top: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace;
         color: #e6e6e6; background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 4px;
         pointer-events: none; white-space: pre; }
  #hud { z-index: 5; }
  /* Report tool (report.js): same styles as index.html */
  #tools { position: fixed; right: 8px; top: 8px; z-index: 10; display: flex; gap: 6px; }
  #tools button, #rep-form button { font: 12px ui-monospace, Menlo, monospace; color: #eee; background: rgba(0,0,0,.6);
         border: 1px solid #666; border-radius: 4px; padding: 5px 9px; cursor: pointer; }
  #tools button:hover, #rep-form button:hover { background: rgba(60,60,70,.9); }
  #warp-pick { font: 12px ui-monospace, Menlo, monospace; color: #eee; background: rgba(0,0,0,.6); border: 1px solid #666;
         border-radius: 4px; padding: 5px 6px; max-width: 220px; cursor: pointer; }
  #btn-report { border-color: #ff2d55 !important; }
  #toast { position: fixed; z-index: 30; left: 50%; bottom: 24px; transform: translateX(-50%); display: none;
         font: 13px ui-monospace, Menlo, monospace; color: #fff; background: rgba(0,0,0,.8);
         padding: 8px 12px; border-radius: 4px; pointer-events: none; }
  #rep-overlay { position: fixed; inset: 0; z-index: 20; display: none; cursor: crosshair; background: rgba(0,0,0,.08);
         touch-action: none; user-select: none; -webkit-user-select: none; }
  #rep-box { position: fixed; display: none; border: 2px solid #ff2d55; background: rgba(255,45,85,.12);
         pointer-events: none; }
  #rep-hint { position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
         font: 13px ui-monospace, Menlo, monospace; color: #fff; background: rgba(0,0,0,.75);
         padding: 6px 10px; border-radius: 4px; pointer-events: none; }
  #rep-form { position: fixed; display: none; width: 320px; background: rgba(20,20,26,.95); border: 1px solid #555;
         border-radius: 6px; padding: 8px; cursor: default; }
  #rep-form textarea { width: 100%; box-sizing: border-box; font: 12px ui-monospace, Menlo, monospace;
         color: #eee; background: #111; border: 1px solid #444; border-radius: 3px; resize: vertical; }
  #rep-form .row { display: flex; gap: 6px; margin-top: 6px; }
  #rep-status { font: 11px ui-monospace, Menlo, monospace; color: #fa8; margin-top: 4px; min-height: 1em; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
         font: 14px ui-monospace, Menlo, monospace; color: #ccc; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud"></div>
<div id="tools"><select id="warp-pick" title="Warp to a place in the level (page aid, not the game)"></select><button id="btn-report" type="button">Report (R)</button></div>
<div id="toast"></div>
<div id="msg">loading…</div>
<script type="module">
  // warp picker (PAGE AID, warp.js): a pick reloads the page with ?warp=<name>, other options kept. Mouse only, so it can't take
  // game keys or type-ahead to a place: out of the Tab order (tabindex -1), it blurs when a row is picked in its popup (the
  // same row or not) and on a click elsewhere; a key reaching it while closed is cancelled (no type-ahead / arrow / End pick /
  // popup) and blurs it, then goes on to the game's handlers, except Escape, which only blurs it.
  import { warpOptions, warpUrl } from './warp.js';
  const sel = document.getElementById('warp-pick');
  const cur = new URLSearchParams(location.search).get('warp');
  sel.add(new Option('Warp to…', ''));
  for (const o of warpOptions()) sel.add(new Option(o.label, o.name));
  if (cur && [...sel.options].some(o => o.value === cur)) sel.value = cur;
  sel.addEventListener('change', () => { const v = sel.value; sel.blur(); if (v) location.search = warpUrl(location.search, v); });
  sel.tabIndex = -1;
  // Chrome: a row picked in the popup fires a click with detail 0. A mouse click on the control keeps focus: the page can't
  // tell an opening click from a closing one (Escape in the popup closes it with no keydown), and a focused, closed control
  // gives the next key straight back (the listener below)
  sel.addEventListener('click', e => { if (e.detail === 0) sel.blur(); });
  // on window, capture, registered before play.js's: pause_layer.js listens there too, so this is first to see Escape
  addEventListener('keydown', e => {
    if (e.target !== sel) return;
    e.preventDefault(); sel.blur();
    if (e.code === 'Escape') e.stopImmediatePropagation();
  }, true);
  addEventListener('pointerdown', e => { if (e.target !== sel) sel.blur(); }, true);
</script>
<script type="module" src="play.js"></script>
</body>
</html>
